<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}flatfinder{% endblock %}</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #21201c; --muted: #6f6d66; --line: #e4e2dc;
    --card: #fff; --accent: #2d6a4f; --warn: #b45309; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1a1917; --fg:#eceae4; --muted:#9a968c; --line:#33312c;
            --card:#232220; --accent:#74c69d; --warn:#e0a458; --bad:#f2836b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 16px 64px; background:var(--bg); color:var(--fg);
         font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { padding: 28px 0 18px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  h1 { margin:0; font-size:21px; letter-spacing:-.01em; }
  .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0 26px; }
  .stat { flex:1 1 130px; background:var(--card); border:1px solid var(--line);
          border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:24px; font-weight:600; letter-spacing:-.02em; }
  .stat span { color:var(--muted); font-size:12px; text-transform:uppercase;
               letter-spacing:.04em; }
  .banner { background:var(--card); border:1px solid var(--warn); border-left-width:3px;
            border-radius:8px; padding:11px 14px; margin-bottom:22px; font-size:13.5px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
       color:var(--muted); font-weight:600; padding:0 10px 8px; }
  td { padding:11px 10px; border-top:1px solid var(--line); vertical-align:top; }
  tr:hover td { background:var(--card); }
  a { color:inherit; }
  .title { font-weight:500; }
  .meta { color:var(--muted); font-size:12.5px; margin-top:2px; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .score { display:inline-block; min-width:34px; text-align:center; padding:2px 7px;
           border-radius:5px; font-size:12.5px; font-weight:600;
           font-variant-numeric:tabular-nums; }
  .s-hi { background:color-mix(in srgb,var(--accent) 18%,transparent); color:var(--accent); }
  .s-mid{ background:color-mix(in srgb,var(--warn) 18%,transparent); color:var(--warn); }
  .s-lo { color:var(--muted); }
  .tag { font-size:11.5px; padding:2px 7px; border-radius:5px; border:1px solid var(--line);
         color:var(--muted); white-space:nowrap; }
  .t-sent { border-color:var(--accent); color:var(--accent); }
  .t-pending { border-color:var(--warn); color:var(--warn); }
  .t-failed { border-color:var(--bad); color:var(--bad); }
  .empty { padding:48px 0; text-align:center; color:var(--muted); }
  pre { background:var(--card); border:1px solid var(--line); border-radius:8px;
        padding:16px; white-space:pre-wrap; font:14px/1.6 ui-monospace,monospace; }
  .head-row { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  button { font:inherit; font-weight:500; padding:8px 16px; border-radius:8px; cursor:pointer;
           border:1px solid var(--line); background:var(--card); color:var(--fg); }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .statusbar { display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;
               font-size:12.5px; color:var(--muted); margin:-8px 0 20px; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--line);
         display:inline-block; margin-right:5px; }
  .dot-ok { background:var(--accent); }
  .dot-run { background:var(--warn); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.3 } }
  .aus { color:var(--bad); }
  .banner.err { border-color:var(--bad); }
  .toolbar { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px;
             margin-bottom:14px; font-size:14px; }
  .toolbar b { font-size:17px; }
  .toolbar .muted, .muted { color:var(--muted); }
  .toggle { margin-left:auto; font-size:12.5px; color:var(--muted); }
  .neu { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;
         color:var(--accent); border:1px solid var(--accent); border-radius:4px;
         padding:1px 5px; margin-left:7px; vertical-align:2px; }
  .src { font-variant:all-small-caps; letter-spacing:.03em; }
  .why { font-size:12px; color:var(--muted); margin-top:3px; font-style:italic; }
  tr.dim td { opacity:.45; }
  @media (max-width:640px){ .hide-s{display:none} td,th{padding-left:6px;padding-right:6px} }
</style>
</head>
<body><div class="wrap">{% block body %}{% endblock %}</div></body>
</html>
