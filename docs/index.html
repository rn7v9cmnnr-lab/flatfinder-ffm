<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flatfinder</title>
<meta name="description" content="Wohnungsangebote Frankfurt, stündlich aktualisiert.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"
      integrity="sha512-Zcn6bjR/8RZbLEpLIeOwNtzREBAJnUKESxces60Mpoj+2okopSAcSUIUOseddDm0cxnGQzxIR7vJgsLZbdLE3w=="
      crossorigin="" referrerpolicy="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<style>
  :root{
    --bg:#fbfbfa; --fg:#21201c; --muted:#6f6d66; --line:#e4e2dc; --card:#fff;
    --accent:#2d6a4f; --warn:#b45309; --bad:#b3261e; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#1a1917; --fg:#eceae4; --muted:#9a968c; --line:#33312c; --card:#232220;
    --accent:#74c69d; --warn:#e0a458; --bad:#f2836b; --shadow:0 1px 3px rgba(0,0,0,.3);
  }}
  :root[data-theme="dark"]{
    --bg:#1a1917; --fg:#eceae4; --muted:#9a968c; --line:#33312c; --card:#232220;
    --accent:#74c69d; --warn:#e0a458; --bad:#f2836b; --shadow:0 1px 3px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:0 16px 80px;background:var(--bg);color:var(--fg);
       font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto}
  header{padding:26px 0 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
  h1{margin:0;font-size:21px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px;margin-top:5px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:5px}

  /* --- Filter --- */
  .filters{background:var(--card);border:1px solid var(--line);border-radius:14px;
           padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
  .frow{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:4px;min-width:0}
  .f label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
  .f input[type=number],.f select{font:inherit;font-size:14px;padding:6px 8px;width:92px;
      border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
  .f select{width:auto;min-width:130px;max-width:200px}
  .f.wide{flex:1 1 200px}
  .f.wide input{width:100%}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .frow.gruppe{margin-top:12px;padding:10px 12px 12px;border-radius:10px;
               background:color-mix(in srgb,var(--fg) 3%,transparent);
               align-items:flex-end;gap:12px 16px}
  .gruppenlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
                color:var(--muted);font-weight:600;align-self:center;
                padding-right:4px;border-right:1px solid var(--line);
                margin-right:2px;line-height:2.4}
  .tipp{font-size:12px;color:var(--muted);align-self:center;font-style:italic}
  .chip{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);
        background:var(--bg);color:var(--muted);cursor:pointer;user-select:none}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
        background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:500}
  button{font:inherit;padding:6px 14px;border-radius:7px;cursor:pointer;
         border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .reset{font-size:12.5px;color:var(--muted);background:none;border:none;padding:4px;text-decoration:underline}

  /* --- Liste --- */
  .bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin:0 0 12px}
  .bar b{font-size:17px}
  .muted{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
     color:var(--muted);font-weight:600;padding:0 10px 8px;cursor:pointer;white-space:nowrap}
  th:hover{color:var(--fg)}
  th[aria-sort]{color:var(--fg)}
  th[aria-sort]::after{content:" ↓";opacity:.6}
  th[aria-sort="ascending"]::after{content:" ↑"}
  td{padding:12px 10px;border-top:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--card)}
  .title{font-weight:500;line-height:1.35}
  .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .score{display:inline-block;min-width:34px;text-align:center;padding:2px 7px;border-radius:5px;
         font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .s-hi{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .s-mid{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
  .s-lo{color:var(--muted)}
  .neu{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
       color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 5px;margin-left:7px}
  .weg{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);
       border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:7px}
  .src{font-variant:all-small-caps;letter-spacing:.03em}

  /* Farben nach Art des Anbieters. Drei Hues plus neutral - mehr lassen
     sich nicht zuverlaessig unterscheiden (mit Palettenvalidator geprueft,
     hell und dunkel, alle Paare). Die Art steht immer auch als Text im
     Badge, Farbe ist nie das einzige Merkmal. */
  :root{ --k-landlord:#2a78d6; --k-portal:#eb6834; --k-coop:#1baf7a; --k-other:var(--muted); }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --k-landlord:#3987e5; --k-portal:#d95926; --k-coop:#199e70;
  }}
  :root[data-theme="dark"]{ --k-landlord:#3987e5; --k-portal:#d95926; --k-coop:#199e70; }

  .kind{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
        color:var(--muted);white-space:nowrap}
  .kind::before{content:"";width:8px;height:8px;border-radius:2px;flex:none;
                background:var(--k-other)}
  .kind.k-grossvermieter::before{background:var(--k-landlord)}
  .kind.k-portal::before{background:var(--k-portal)}
  .kind.k-genossenschaft::before{background:var(--k-coop)}
  td.artcell{border-left:3px solid var(--k-other);padding-left:9px}
  tr.k-grossvermieter td.artcell{border-left-color:var(--k-landlord)}
  tr.k-portal td.artcell{border-left-color:var(--k-portal)}
  tr.k-genossenschaft td.artcell{border-left-color:var(--k-coop)}

  .legende{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;
           color:var(--muted);margin:-4px 0 14px}
  .preis b{font-variant-numeric:tabular-nums}
  .viewbtn{margin-left:12px;font-size:13px;padding:4px 12px}
  #karte{height:460px;border:1px solid var(--line);border-radius:12px;
         margin-bottom:10px;background:var(--card);z-index:0}
  #kartehinweis{font-size:12.5px;margin-bottom:16px}
  .leaflet-container{background:var(--card);font:inherit}
  .marker{width:13px;height:13px;border-radius:50%;border:2px solid #fff;
          box-shadow:0 1px 3px rgba(0,0,0,.4);background:var(--k-other)}
  .marker.k-grossvermieter{background:var(--k-landlord)}
  .marker.k-portal{background:var(--k-portal)}
  .marker.k-genossenschaft{background:var(--k-coop)}
  .marker.approx{opacity:.55;border-style:dashed}
  .leaflet-popup-content{margin:10px 12px;font:inherit;font-size:13px}
  .leaflet-popup-content b{display:block;margin-bottom:3px}
  .leaflet-popup-content a{color:var(--accent)}
  .preis small{display:block;font-size:10.5px;text-transform:uppercase;
               letter-spacing:.04em;color:var(--muted);font-weight:600}
  .warmonly b{color:var(--muted)}
  .dist{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{padding:56px 16px;text-align:center;color:var(--muted)}

  /* --- Detail --- */
  dialog{border:none;border-radius:14px;padding:0;background:var(--card);color:var(--fg);
         max-width:560px;width:calc(100% - 32px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .d-head{padding:20px 22px 0}
  .d-head h2{margin:0;font-size:18px;line-height:1.35}
  .d-img{width:100%;height:190px;object-fit:cover;margin-top:14px;background:var(--bg)}
  .d-body{padding:16px 22px 20px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
  .fact b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .fact span{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .why{font-size:13px;color:var(--muted);font-style:italic;margin-bottom:16px}
  .d-actions{display:flex;gap:10px;flex-wrap:wrap}
  .d-actions a{flex:1;text-align:center;text-decoration:none;padding:9px 14px;border-radius:8px;
               border:1px solid var(--accent);color:var(--accent);font-weight:500;font-size:14px}
  .d-actions a.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .d-close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:22px;
           line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}

  /* ---------- Vorschaubilder ---------- */
  .thumbcol{width:88px;padding-right:0}
  .thumb{width:76px;height:58px;object-fit:cover;border-radius:8px;display:block;
         background:var(--line);border:1px solid var(--line)}
  .thumb.leer{background:linear-gradient(135deg,var(--line) 0%,transparent 60%)}

  /* ---------- Einklappbare Filtergruppe ---------- */
  .ausklapp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
  .ausklapp summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:baseline;
                    font-size:11px;text-transform:uppercase;letter-spacing:.05em;
                    color:var(--muted);font-weight:600;user-select:none}
  .ausklapp summary::-webkit-details-marker{display:none}
  .ausklapp summary::before{content:"▸";display:inline-block;transition:transform .15s;
                            font-size:13px;line-height:1}
  .ausklapp[open] summary::before{transform:rotate(90deg)}
  .ausklapp .zaehler{text-transform:none;letter-spacing:0;font-weight:400;
                     font-size:12px;color:var(--muted)}
  .ausklapp .chips{margin-top:10px;max-height:150px;overflow-y:auto;padding:2px}

  /* ---------- Feinschliff ---------- */
  .meta .kind{margin-right:8px}
  .meta .src{opacity:.75}
  .preis b{font-size:15px}
  th.thumbcol{width:88px}

  @media (max-width:640px){
    .hide-s{display:none}
    .thumbcol,th.thumbcol{width:60px}
    .thumb{width:52px;height:44px}
    td,th{padding-left:6px;padding-right:6px}
    .f input[type=number]{width:74px}
  }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>flatfinder · <span id="ort">Frankfurt</span></h1>
  <div class="sub"><span class="dot"></span><span id="stand">lädt…</span></div>
</header>

<form class="filters" id="filters" onsubmit="return false">
  <div class="frow">
    <div class="f"><label for="pmax">Kaltmiete bis</label>
      <input type="number" id="pmax" step="50" placeholder="€"></div>
    <div class="f"><label for="qmin">Fläche ab</label>
      <input type="number" id="qmin" step="5" placeholder="m²"></div>
    <div class="f"><label for="rmin">Zimmer ab</label>
      <input type="number" id="rmin" step="1" min="1" placeholder="–"></div>
    <div class="f"><label for="rmax">Zimmer bis</label>
      <input type="number" id="rmax" step="1" min="1" placeholder="–"></div>
    <div class="f"><label for="smin">Score ab</label>
      <input type="number" id="smin" step="5" min="0" max="100" placeholder="0"></div>
  </div>

  <div class="frow gruppe">
    <span class="gruppenlabel">Umkreis</span>
    <div class="f"><label for="plz">PLZ</label>
      <input type="text" id="plz" inputmode="numeric" maxlength="5" placeholder="60311"></div>
    <div class="f"><label for="mitte">oder Ort</label>
      <select id="mitte">
        <option value="">— egal —</option>
        <option value="50.1136,8.6797">Hauptwache</option>
        <option value="50.1070,8.6638">Hauptbahnhof</option>
        <option value="50.1204,8.6520">Messe</option>
        <option value="50.1094,8.7012">EZB / Ostend</option>
        <option value="50.1250,8.6800">Nordend</option>
        <option value="50.1020,8.6830">Sachsenhausen</option>
      </select></div>
    <div class="f"><label for="umkreis">max. km</label>
      <input type="number" id="umkreis" step="0.5" min="0.5" placeholder="km"
             title="Luftlinie. Ein ~ vor der Entfernung heißt: Position geschätzt."></div>
    <span class="tipp">oder in der Karte klicken</span>
  </div>

  <div class="frow">
    <div class="f wide"><label for="suche">Suchbegriff</label>
      <input type="text" id="suche" placeholder="Balkon, Stadtteil, Straße…"
             style="font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)"></div>
  </div>
  <details class="ausklapp" id="bezirkeBox">
    <summary><span>Stadtteil</span><span class="zaehler" id="bezirkeZaehler"></span></summary>
    <div class="chips" id="bezirke"></div>
  </details>
  <div class="frow" style="margin-top:12px">
    <div class="f"><label>Quelle</label><div class="chips" id="quellen"></div></div>
    <div class="f"><label>Sonstiges</label><div class="chips">
      <button type="button" class="chip" id="chipNeu" aria-pressed="false">nur neue</button>
      <button type="button" class="chip" id="chipWeg" aria-pressed="false">verschwundene zeigen</button>
    </div></div>
    <button type="button" class="reset" id="reset" style="margin-left:auto">Filter zurücksetzen</button>
  </div>
</form>

<div class="legende" id="legende"></div>

<div class="bar">
  <b id="anzahl">–</b><span class="muted" id="vonwie"></span>
  <button type="button" id="ansicht" class="viewbtn">Karte</button>
  <span class="muted" style="margin-left:auto" id="quellenstand"></span>
</div>

<div id="karte" hidden></div>
<div id="kartehinweis" class="muted" hidden></div>

<table id="tabelle">
  <thead><tr>
    <th class="thumbcol"></th>
    <th data-sort="title">Objekt</th>
    <th class="num" data-sort="_preis">Miete</th>
    <th class="num hide-s" data-sort="sqm">m²</th>
    <th class="num hide-s" data-sort="price_per_sqm">€/m²</th>
    <th class="num hide-s" data-sort="_dist">Entf.</th>
    <th class="num" data-sort="score" aria-sort="descending">Score</th>
  </tr></thead>
  <tbody id="zeilen"></tbody>
</table>
<div class="empty" id="leer" hidden></div>

</div>

<dialog id="detail">
  <button class="d-close" onclick="document.getElementById('detail').close()" aria-label="Schließen">×</button>
  <div class="d-head"><h2 id="dTitel"></h2></div>
  <img id="dBild" class="d-img" alt="" hidden onerror="this.hidden=true">
  <div class="d-body">
    <div class="facts" id="dFacts"></div>
    <div class="why" id="dWhy"></div>
    <div class="d-actions">
      <a id="dLink" class="primary" target="_blank" rel="noopener">Zum Angebot</a>
      <a id="dKarte" target="_blank" rel="noopener">Auf der Karte</a>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
        integrity="sha512-BwHfrr4c9kmRkLw6iXFdzcdWV/PGkVgiIyIWLLlTSXzWQzxuSg4DiQUCpauz/EWjgk5TYQqX/kvn9pG1NpYfqg=="
        crossorigin="" referrerpolicy="no-referrer"></script>
<script>
const LS = "flatfinder.filter.v1";
let ALLE = [], SORT = {feld:"score", ab:true}, PLZ_POS = {};

const el = id => document.getElementById(id);
const eur = n => n == null ? "—" : n.toLocaleString("de-DE") + " €";
const num = (n,d=0) => n == null ? "—" : n.toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});

// --- Filterzustand: bleibt im Browser, damit er einen Neuladen überlebt ---
function filterLesen(){
  return {
    pmax:+el("pmax").value||null, qmin:+el("qmin").value||null,
    rmin:+el("rmin").value||null, rmax:+el("rmax").value||null,
    smin:+el("smin").value||null, suche:el("suche").value.trim().toLowerCase(),
    mitte:el("mitte").value, umkreis:+el("umkreis").value||null,
    plz:el("plz").value.trim(), karte:KARTE_AN, klick:KLICK_MITTE,
    bezirke:[...document.querySelectorAll('#bezirke .chip[aria-pressed="true"]')].map(c=>c.dataset.v),
    quellen:[...document.querySelectorAll('#quellen .chip[aria-pressed="true"]')].map(c=>c.dataset.v),
    nurNeu:el("chipNeu").getAttribute("aria-pressed")==="true",
    zeigWeg:el("chipWeg").getAttribute("aria-pressed")==="true",
  };
}
function filterSchreiben(f){
  if(!f) return;
  for(const k of ["pmax","qmin","rmin","rmax","smin","suche","mitte","umkreis","plz"])
    if(f[k]!=null) el(k).value=f[k];
  if(f.klick) KLICK_MITTE = f.klick;
  if(f.karte) KARTE_AN = f.karte;
  el("chipNeu").setAttribute("aria-pressed", !!f.nurNeu);
  el("chipWeg").setAttribute("aria-pressed", !!f.zeigWeg);
}
function speichern(){
  try{ localStorage.setItem(LS, JSON.stringify(filterLesen())); }catch(e){}
}
function geladen(){
  try{ return JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ return null; }
}

const ART = {
  grossvermieter: "Großvermieter",
  genossenschaft: "Genossenschaft",
  portal: "Portal",
  sonstige: "Sonstige",
};

// Luftlinie in km. Reicht voellig - fuer "ist das noch in meiner Ecke"
// braucht niemand Routing, und es geht ohne jeden fremden Dienst.
function distanz(aLat,aLng,bLat,bLng){
  const R=6371, r=Math.PI/180;
  const dLat=(bLat-aLat)*r, dLng=(bLng-aLng)*r;
  const h=Math.sin(dLat/2)**2 + Math.cos(aLat*r)*Math.cos(bLat*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

// Die Quellen liefern mal Kalt-, mal nur Warmmiete. Das darf die
// Oberflaeche nicht verwischen - sonst vergleicht man Aepfel mit Birnen.
function miete(l){
  if(l.price_cold!=null) return {wert:l.price_cold, art:"kalt", warm:false};
  if(l.price_warm!=null) return {wert:l.price_warm, art:"warm", warm:true};
  return {wert:null, art:"", warm:false};
}

function istNeu(l){
  return (Date.now() - new Date(l.first_seen).getTime()) < 36e5*24;
}

function passt(l, f){
  if(l.gone && !f.zeigWeg) return false;
  if(f.pmax){
    // Gegen die Kaltmiete pruefen, wo sie bekannt ist. Kennt die Quelle nur
    // die Warmmiete, waere ein direkter Vergleich unfair - dann grosszuegig
    // mit Aufschlag pruefen und das Angebot lieber zeigen als verstecken.
    const m = miete(l);
    if(m.wert==null) return false;
    const grenze = m.warm ? f.pmax*1.35 : f.pmax;
    if(m.wert > grenze) return false;
  }
  if(f.qmin && (l.sqm==null || l.sqm < f.qmin)) return false;
  if(f.rmin && (l.rooms==null || l.rooms < f.rmin)) return false;
  if(f.rmax && (l.rooms==null || l.rooms > f.rmax)) return false;
  if(f.smin && (l.score||0) < f.smin) return false;
  if(f.quellen.length && !f.quellen.includes(l.source)) return false;
  if(f.bezirke.length && !f.bezirke.includes(l.district || l.city || "?")) return false;
  if(f.nurNeu && !istNeu(l)) return false;
  if(f.umkreis && f.mitte){
    // Ohne Koordinaten koennen wir nichts ausschliessen - solche Angebote
    // bleiben sichtbar und werden in der Liste als "?" gekennzeichnet,
    // statt stillschweigend zu verschwinden.
    if(l._dist!=null && l._dist > f.umkreis) return false;
  }
  if(f.suche){
    const heu = [l.title,l.street,l.district,l.city,l.zip,(l.score_reasons||[]).join(" ")]
      .filter(Boolean).join(" ").toLowerCase();
    if(!heu.includes(f.suche)) return false;
  }
  return true;
}

// Reihenfolge des Vorrangs: was du auf der Karte angeklickt hast, schlaegt
// die PLZ, und die schlaegt die Auswahlliste. So gewinnt immer die zuletzt
// bewusst gesetzte Angabe.
function mittelpunkt(f){
  if(f.klick) return f.klick;
  if(f.plz && /^\d{5}$/.test(f.plz) && PLZ_POS[f.plz]) return PLZ_POS[f.plz];
  if(f.mitte) return f.mitte.split(",").map(Number);
  return null;
}

function zeichnen(){
  const f = filterLesen();
  const mitte = mittelpunkt(f);
  for(const l of ALLE){
    l._dist = (mitte && l.lat!=null && l.lng!=null)
      ? distanz(mitte[0],mitte[1],l.lat,l.lng) : null;
    const m = miete(l);
    l._preis = m.wert;
  }
  let liste = ALLE.filter(l => passt(l,f));
  const rv = SORT.ab ? -1 : 1;
  liste.sort((a,b)=>{
    const x=a[SORT.feld], y=b[SORT.feld];
    if(x==null && y==null) return 0;
    if(x==null) return 1;            // Leerwerte immer ans Ende
    if(y==null) return -1;
    return (typeof x==="string" ? x.localeCompare(y,"de") : x-y) * rv;
  });

  el("anzahl").textContent = liste.length;
  el("vonwie").textContent = `von ${ALLE.filter(l=>!l.gone).length} Angeboten`;

  const tb = el("zeilen");
  tb.replaceChildren();
  for(const l of liste){
    const tr = document.createElement("tr");
    tr.onclick = () => zeigeDetail(l);
    const sc = l.score||0;
    const art = l.kind || "sonstige";
    const m = miete(l);
    tr.className = "k-" + art;
    tr.innerHTML = `
      <td class="artcell thumbcol">${l.image_url
        ? `<img class="thumb" src="${esc(l.image_url)}" alt="" loading="lazy" onerror="this.replaceWith(leerBild())">`
        : `<div class="thumb leer"></div>`}</td>
      <td>
        <div class="title">${esc(l.title).slice(0,78)}${istNeu(l)?'<span class="neu">neu</span>':''}${l.gone?'<span class="weg">weg</span>':''}</div>
        <div class="meta">${l.rooms?num(l.rooms)+" Zimmer · ":""}${l.sqm?num(l.sqm)+" m² · ":""}${esc(l.zip||"")} ${esc(l.district||l.city||"")}</div>
        <div class="meta"><span class="kind k-${esc(art)}">${esc(ART[art]||art)}</span><span class="src">${esc(l.source)}</span></div>
      </td>
      <td class="num preis ${m.warm?'warmonly':''}"><b>${eur(m.wert)}</b><small>${m.art}</small></td>
      <td class="num hide-s">${num(l.sqm)}</td>
      <td class="num hide-s">${num(l.price_per_sqm,2)}</td>
      <td class="num hide-s dist" title="${l.position_approx?'Position über den Stadtteil oder die PLZ geschätzt':''}">${
        l._dist!=null ? (l.position_approx?"~":"")+num(l._dist,1)+" km" : "–"}</td>
      <td class="num"><span class="score ${sc>=85?'s-hi':sc>=60?'s-mid':'s-lo'}">${sc}</span></td>`;
    tb.appendChild(tr);
  }
  el("karte").hidden = !KARTE_AN;
  el("kartehinweis").hidden = !KARTE_AN;
  el("tabelle").hidden = KARTE_AN;
  if(KARTE_AN){
    karteZeichnen(liste, mitte, f.umkreis);
    setTimeout(()=>MAP && MAP.invalidateSize(), 60);
  }

  const leer = el("leer");
  leer.hidden = liste.length > 0 || KARTE_AN;
  leer.textContent = ALLE.length
    ? "Nichts passt zu diesen Filtern. Probier weniger streng — oder „Filter zurücksetzen“."
    : "Noch keine Daten.";
  speichern();
}

let MAP=null, MARKER=null, KREIS=null, KARTE_AN=false, KLICK_MITTE=null;

function karteAufbauen(){
  if(MAP) return MAP;
  MAP = L.map("karte", {scrollWheelZoom:false}).setView([50.1136,8.6797], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '&copy; OpenStreetMap'
  }).addTo(MAP);
  MARKER = L.layerGroup().addTo(MAP);
  // Klick auf die Karte setzt den Suchmittelpunkt. Das ist der ganze Sinn
  // der Ansicht: zeigen statt tippen.
  MAP.on("click", e => {
    KLICK_MITTE = [e.latlng.lat, e.latlng.lng];
    el("plz").value = "";
    el("mitte").value = "";
    if(!el("umkreis").value) el("umkreis").value = 3;
    zeichnen();
  });
  return MAP;
}

function karteZeichnen(liste, mitte, radius){
  const map = karteAufbauen();
  MARKER.clearLayers();

  const mitPos = liste.filter(l => l.lat!=null && l.lng!=null);
  for(const l of mitPos){
    const art = l.kind || "sonstige";
    const icon = L.divIcon({
      className: "",
      html: `<div class="marker k-${art}${l.position_approx?" approx":""}"></div>`,
      iconSize: [13,13], iconAnchor: [6,6],
    });
    const m = L.marker([l.lat, l.lng], {icon}).addTo(MARKER);
    const p = miete(l);
    m.bindPopup(
      `<b>${esc(l.title).slice(0,70)}</b>`
      + `${l.rooms?num(l.rooms)+" Zi · ":""}${l.sqm?num(l.sqm)+" m² · ":""}`
      + `${eur(p.wert)} ${p.art}<br>`
      + `<span class="kind k-${art}">${esc(ART[art]||art)}</span> · ${esc(l.source)}<br>`
      + `<a href="${esc(l.url)}" target="_blank" rel="noopener">Zum Angebot →</a>`
    );
  }

  if(KREIS){ KREIS.remove(); KREIS = null; }
  if(mitte && radius){
    KREIS = L.circle(mitte, {radius: radius*1000, color:"var(--accent)",
                             weight:2, fillOpacity:.06}).addTo(map);
    map.fitBounds(KREIS.getBounds(), {padding:[20,20]});
  } else if(mitPos.length){
    map.fitBounds(L.latLngBounds(mitPos.map(l=>[l.lat,l.lng])), {padding:[25,25]});
  }

  const ohne = liste.length - mitPos.length;
  el("kartehinweis").textContent =
    `${mitPos.length} Angebote auf der Karte`
    + (ohne ? ` · ${ohne} ohne bekannte Lage (nur in der Liste)` : "")
    + ` · Klick auf die Karte setzt den Mittelpunkt`
    + ` · gestrichelter Rand = Lage über Stadtteil/PLZ geschätzt`;
}

function zeigeDetail(l){
  el("dTitel").textContent = l.title;
  const bild = el("dBild");
  bild.hidden = true;
  if(l.image_url){ bild.src = l.image_url; bild.hidden = false; }

  const facts = [
    ["Kaltmiete", eur(l.price_cold)], ["Warmmiete", eur(l.price_warm)],
    ["Anbieterart", ART[l.kind||"sonstige"]||"—"],
    ["Entfernung", l._dist!=null
        ? (l.position_approx ? "~" : "") + num(l._dist,1) + " km"
          + (l.position_approx ? " (Stadtteilmitte)" : "") : "—"],
    ["Fläche", l.sqm?num(l.sqm)+" m²":"—"], ["Zimmer", l.rooms?num(l.rooms):"—"],
    ["€/m²", num(l.price_per_sqm,2)], ["Score", String(l.score??"—")],
    ["Frei ab", l.available_from || "—"],
    ["Adresse", [l.street, [l.zip,l.district||l.city].filter(Boolean).join(" ")].filter(Boolean).join(", ") || "—"],
  ];
  el("dFacts").replaceChildren(...facts.map(([k,v])=>{
    const d=document.createElement("div"); d.className="fact";
    d.innerHTML=`<b>${esc(v)}</b><span>${esc(k)}</span>`; return d;
  }));
  el("dWhy").textContent = (l.score_reasons||[]).join(" · ");
  el("dLink").href = l.url;
  const karte = el("dKarte");
  if(l.lat && l.lng){ karte.href = `https://www.openstreetmap.org/?mlat=${l.lat}&mlon=${l.lng}#map=17/${l.lat}/${l.lng}`; karte.hidden=false; }
  else { karte.hidden = true; }
  el("detail").showModal();
}

function leerBild(){
  const d=document.createElement("div"); d.className="thumb leer"; return d;
}

function esc(s){ return String(s??"").replace(/[<>&"]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }

function zaehlerAuffrischen(){
  const n = document.querySelectorAll('#bezirke .chip[aria-pressed="true"]').length;
  el("bezirkeZaehler").textContent = n ? `${n} gewählt` : "alle";
}

function chips(ziel, werte, gespeichert){
  const box = el(ziel);
  box.replaceChildren(...werte.map(v=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.v=v; b.textContent=v;
    b.setAttribute("aria-pressed", (gespeichert||[]).includes(v));
    b.onclick=()=>{
      b.setAttribute("aria-pressed", b.getAttribute("aria-pressed")!=="true");
      zaehlerAuffrischen(); zeichnen();
    };
    return b;
  }));
}

async function start(){
  let d;
  try{
    const r = await fetch("data/listings.json?t=" + Date.now());
    if(!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  }catch(e){
    el("stand").textContent = "Daten konnten nicht geladen werden (" + e.message + ")";
    return;
  }
  ALLE = d.listings || [];
  PLZ_POS = d.plz || {};
  el("ort").textContent = (d.city||"").replace(" am Main","");
  const alter = Math.round((Date.now()-new Date(d.generated_at).getTime())/6e4);
  el("stand").textContent = alter < 90
    ? `aktualisiert vor ${alter} Min.`
    : `aktualisiert ${new Date(d.generated_at).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}`;
  el("quellenstand").textContent = Object.entries(d.sources||{}).map(([k,v])=>`${k}: ${v}`).join(" · ");

  const gesp = geladen();
  if(gesp) filterSchreiben(gesp);
  else el("smin").value = 50;   // Erstbesuch: Ausschusskriterien ausblenden
  chips("bezirke", [...new Set(ALLE.map(l=>l.district||l.city||"?"))].sort((a,b)=>a.localeCompare(b,"de")), gesp?.bezirke);
  chips("quellen", [...new Set(ALLE.map(l=>l.source))].sort(), gesp?.quellen);

  // Legende nur fuer die Arten, die auch vorkommen.
  const arten = [...new Set(ALLE.map(l=>l.kind||"sonstige"))]
    .sort((a,b)=>Object.keys(ART).indexOf(a)-Object.keys(ART).indexOf(b));
  el("legende").replaceChildren(...arten.map(a=>{
    const n = ALLE.filter(l=>(l.kind||"sonstige")===a).length;
    const sp=document.createElement("span");
    sp.className="kind k-"+a; sp.textContent=`${ART[a]||a} (${n})`;
    return sp;
  }));

  zaehlerAuffrischen();
  el("filters").addEventListener("input", () => {
    // Eine getippte PLZ oder eine gewaehlte Marke hebt den Kartenklick auf.
    if(document.activeElement===el("plz") || document.activeElement===el("mitte"))
      KLICK_MITTE = null;
    zeichnen();
  });
  el("mitte").addEventListener("change", () => { KLICK_MITTE=null; zeichnen(); });
  el("ansicht").onclick = () => {
    KARTE_AN = !KARTE_AN;
    el("ansicht").textContent = KARTE_AN ? "Liste" : "Karte";
    zeichnen();
  };
  el("ansicht").textContent = KARTE_AN ? "Liste" : "Karte";
  el("chipNeu").onclick = el("chipWeg").onclick = e => {
    e.target.setAttribute("aria-pressed", e.target.getAttribute("aria-pressed")!=="true"); zeichnen();
  };
  el("reset").onclick = () => {
    try{ localStorage.removeItem(LS); }catch(e){}
    el("filters").reset();
    KLICK_MITTE = null;
    document.querySelectorAll('.chip').forEach(c=>c.setAttribute("aria-pressed","false"));
    zeichnen();
  };
  document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.onclick = () => {
      const feld = th.dataset.sort;
      SORT = {feld, ab: SORT.feld===feld ? !SORT.ab : true};
      document.querySelectorAll("th[data-sort]").forEach(t=>t.removeAttribute("aria-sort"));
      th.setAttribute("aria-sort", SORT.ab ? "descending" : "ascending");
      zeichnen();
    };
  });
  zeichnen();
}
start();
</script>
